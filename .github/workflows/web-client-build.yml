name: GoreeCloud Drive web-client build
on:
  pull_request:
    paths:
      - "web-client/**"
      - "scripts/build_drive_web_client.sh"
      - "scripts/embedded-web-smoke/**"
      - "services/web/assets/core/**"
      - "services/web/web_embedded_test.go"
      - "services/web/web_source_disclosure_test.go"
      - "services/web/web_missing_assets_test.go"
      - "services/web/pkg/assets/**"
      - ".github/workflows/web-client-build.yml"
  push:
    branches: [main]
    paths:
      - "web-client/**"
      - "scripts/build_drive_web_client.sh"
      - "scripts/embedded-web-smoke/**"
      - "services/web/assets/core/**"
      - "services/web/web_embedded_test.go"
      - "services/web/web_source_disclosure_test.go"
      - "services/web/web_missing_assets_test.go"
      - "services/web/pkg/assets/**"
      - ".github/workflows/web-client-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
      - name: Enable pinned PNPM
        run: corepack enable
      - name: Rebuild embedded Files frontend from pinned AGPL source
        run: bash scripts/build_drive_web_client.sh
      - name: Verify embedded output is generated from checked-in sources
        run: |
          git diff --exit-code -- services/web/assets/core
          test -s web-client/LICENSE
          test -s web-client/pnpm-lock.yaml
          test -s services/web/assets/core/index.html
          grep -q '<title>GoreeCloud Drive</title>' services/web/assets/core/index.html
          grep -q '"name": "GoreeCloud Drive"' services/web/assets/core/manifest.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate real embedded UI and backend web contracts
        run: go test -mod=vendor ./services/web/...
      - name: Install Chromium browser for real asset-delivery smoke test
        run: cd web-client && pnpm exec playwright install --with-deps chromium
      - name: Browser smoke against isolated embedded web asset server
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          go build -p=2 -mod=vendor -o "$RUNNER_TEMP/goreecloud-embedded-web-smoke" ./scripts/embedded-web-smoke
          if GOREECLOUD_EMBEDDED_SMOKE_ADDR=0.0.0.0:18523 "$RUNNER_TEMP/goreecloud-embedded-web-smoke" > "$RUNNER_TEMP/unsafe-bind.log" 2>&1; then
            echo "Embedded smoke server unexpectedly allowed a public bind" >&2
            exit 1
          fi
          "$RUNNER_TEMP/goreecloud-embedded-web-smoke" > "$RUNNER_TEMP/embedded-web-smoke.log" 2>&1 &
          smoke_pid=$!
          trap 'kill "$smoke_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:18523/manifest.json > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            cat "$RUNNER_TEMP/embedded-web-smoke.log"
            echo "Embedded web smoke server did not start" >&2
            exit 1
          fi
          (cd web-client && node tests/smoke/embedded-assets.mjs)
