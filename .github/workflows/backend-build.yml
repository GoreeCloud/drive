name: GoreeCloud Drive full backend build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backend-build.yml"
      - "go.mod"
      - "go.sum"
      - "vendor/**"
      - "opencloud/**"
      - "internal/**"
      - "pkg/**"
      - "protogen/**"
      - "services/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/backend-build.yml"
      - "go.mod"
      - "go.sum"
      - "vendor/**"
      - "opencloud/**"
      - "internal/**"
      - "pkg/**"
      - "protogen/**"
      - "services/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-backend:
    name: full backend offline build and CLI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Compile complete fork backend from checked-in vendor source
        env:
          GOMAXPROCS: "2"
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTOOLCHAIN: "local"
        run: |
          set -euo pipefail
          go build -p=2 -mod=vendor -trimpath -o "$RUNNER_TEMP/goreecloud-drive-backend" ./opencloud/cmd/opencloud
          test -s "$RUNNER_TEMP/goreecloud-drive-backend"
          file "$RUNNER_TEMP/goreecloud-drive-backend"
      - name: Verify executable CLI without starting services
        env:
          GOMAXPROCS: "2"
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/goreecloud-drive-backend"
          timeout 10s "$binary" --help > "$RUNNER_TEMP/drive-help.txt"
          timeout 10s "$binary" server --help > "$RUNNER_TEMP/server-help.txt"
          timeout 10s "$binary" init --help > "$RUNNER_TEMP/init-help.txt"
          grep -Fq "opencloud [command]" "$RUNNER_TEMP/drive-help.txt"
          grep -Fq "server" "$RUNNER_TEMP/drive-help.txt"
          grep -Fq "fullstack server" "$RUNNER_TEMP/server-help.txt"
          grep -Fq "initialise an OpenCloud config" "$RUNNER_TEMP/init-help.txt"
          go version -m "$binary" > "$RUNNER_TEMP/build-provenance.txt"
          grep -Fq "github.com/opencloud-eu/opencloud" "$RUNNER_TEMP/build-provenance.txt"
          echo "Backend binary compiled and offline CLI smoke passed"
