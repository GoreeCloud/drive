name: GoreeCloud Drive foundation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify provenance, licensing and GoreeCloud Fork classification
        run: |
          test -s LICENSE
          test -s go.mod
          test -s docs/UPSTREAM.md
          test -s docs/UPSTREAM-README.md
          test -s docs/GOREECLOUD-FORK.md
          test -s docs/GC-UI-FOUNDATIONS-THEME.md
          test -s services/web/assets/themes/goreecloud/theme.json
          test -s scripts/generate_gc_ui_theme.py
          python3 -m py_compile scripts/generate_gc_ui_theme.py
          grep -q '/themes/opencloud/theme.json' services/web/pkg/config/defaults/defaultconfig.go
          test ! -e docs/FORK-TO-NATIVE.md
          grep -q '^module github.com/opencloud-eu/opencloud$' go.mod
          grep -q '61ae13a1fea0bb8a36bf4b96c1d222fc84aeaa9c' docs/UPSTREAM.md
          grep -q '\*\*GoreeCloud Fork\*\*' README.md
          grep -q 'GitHub-hosted upstream-linked fork' docs/UPSTREAM.md
          grep -q 'GoreeCloud UI' README.md
          grep -q 'GoreeCloud/gc-ui' docs/GOREECLOUD-FORK.md
          if grep -Ei 'Glaze|Fork-to-Native' README.md docs/GOREECLOUD-FORK.md docs/UPSTREAM.md; then
            echo 'Retired development or UI authority found in active Drive documentation' >&2
            exit 1
          fi
          git diff --check
  theme-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Go web asset and theme security regression tests
        run: go test -mod=vendor ./services/web/pkg/assets ./services/web/pkg/theme
      - name: Vet web asset and theme packages
        run: go vet -mod=vendor ./services/web/pkg/assets ./services/web/pkg/theme
  announcement-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Reject invalid announcement payloads
        run: go test -mod=vendor ./services/web/pkg/announcement
      - name: Vet announcement handlers
        run: go vet -mod=vendor ./services/web/pkg/announcement
