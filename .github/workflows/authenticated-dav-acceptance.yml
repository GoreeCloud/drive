name: GoreeCloud Drive authenticated DAV acceptance gate
on:
  pull_request:
    paths:
      - "scripts/drive_webdav_acceptance.py"
      - "scripts/tests/test_drive_webdav_acceptance.py"
      - "docs/AUTHENTICATED-WEBDAV-ACCEPTANCE.md"
      - ".github/workflows/authenticated-dav-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "scripts/drive_webdav_acceptance.py"
      - "scripts/tests/test_drive_webdav_acceptance.py"
      - "docs/AUTHENTICATED-WEBDAV-ACCEPTANCE.md"
      - ".github/workflows/authenticated-dav-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dav-fixture:
    name: isolated authenticated WebDAV fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile safe DAV acceptance probe
        run: python3 -m py_compile scripts/drive_webdav_acceptance.py
      - name: Exercise read-only and disposable authenticated DAV operations
        run: python3 -m unittest discover -s scripts/tests -p "test_drive_webdav_acceptance.py" -v
