name: GoreeCloud Drive brand integrity
on:
  pull_request:
  push:
    branches: [main, release/goreecloud-7.2.4]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate theme assets and source attribution
        run: python3 scripts/validate_drive_branding.py
      - name: Assert private Drive dev route remains fail-closed
        run: |
          # Guard PR #4 by its stable PR ref as well as the original head name:
          # renaming the head branch must not silently skip the fail-closed gate.
          # Both the placeholder and its validator must exist on that PR.
          if [ "$GITHUB_HEAD_REF" = "dev/drive-dev-private" ] || [ "$GITHUB_REF" = "refs/pull/4/merge" ]; then
            if [ ! -f ops/dev/Caddyfile.private.example ] || [ ! -f ops/tests/test_drive_dev_fail_closed.py ]; then
              echo "FAIL: private Drive dev placeholder or validator is missing"
              exit 1
            fi
          fi
          if [ -f ops/dev/Caddyfile.private.example ]; then
            python3 ops/tests/test_drive_dev_fail_closed.py
          fi
