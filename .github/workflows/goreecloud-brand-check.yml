name: GoreeCloud Drive brand integrity
on:
  pull_request:
  push:
    branches: [main, release/goreecloud-7.2.4]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate theme assets and source attribution
        run: python3 scripts/validate_drive_branding.py
      - name: Assert private Drive dev route remains fail-closed
        run: |
          # On the dedicated dev PR, deletion of the placeholder must fail CI,
          # not silently skip the guard. Other branches without this optional
          # dev-only file retain their existing branding validation behavior.
          if [ "$GITHUB_HEAD_REF" = "dev/drive-dev-private" ] && [ ! -f ops/dev/Caddyfile.private.example ]; then
            echo "FAIL: required private Drive dev placeholder is missing"
            exit 1
          fi
          if [ -f ops/dev/Caddyfile.private.example ]; then
            python3 ops/tests/test_drive_dev_fail_closed.py
          fi
