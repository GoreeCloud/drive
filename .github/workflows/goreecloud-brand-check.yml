name: GoreeCloud Drive brand integrity
on:
  pull_request:
  push:
    branches: [main, release/goreecloud-7.2.4]
permissions:
  contents: read
jobs:
  private_dev_guard:
    # Keep PR #4's private-route and inherited IDP checks separate from the
    # security PR #3 additions to the existing validate job. This prevents
    # overlapping workflow edits on the dependent draft branch.
    if: github.event_name == 'pull_request' && (github.event.pull_request.number == 4 || github.head_ref == 'dev/drive-dev-private')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require private Drive dev placeholder and fail-closed validator
        run: |
          if [ ! -f ops/dev/Caddyfile.private.example ] || [ ! -f ops/tests/test_drive_dev_fail_closed.py ]; then
            echo "FAIL: private Drive dev placeholder or validator is missing"
            exit 1
          fi
          python3 ops/tests/test_drive_dev_fail_closed.py
      - name: Validate inherited IDP lock contract and synthetic drift detection
        run: |
          # Read-only dependency integrity tests, not a vulnerability verdict.
          python3 -m venv "$RUNNER_TEMP/gc-idp-contract-venv"
          "$RUNNER_TEMP/gc-idp-contract-venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --no-cache-dir 'PyYAML==6.0.3'
          "$RUNNER_TEMP/gc-idp-contract-venv/bin/python" ops/tests/test_idp_lock_contract.py
          "$RUNNER_TEMP/gc-idp-contract-venv/bin/python" ops/tests/test_idp_lock_selftest.py
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate theme assets and source attribution
        run: python3 scripts/validate_drive_branding.py
